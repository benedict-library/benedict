name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# macOS runners are scarce. A new push to a pull request cancels its older run,
# so a superseded run does not hold a macOS runner. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Gitea also reads this folder; its runners have no macOS or Windows.
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 runners repeatedly went unassigned for capacity; the Intel pool runs the
        # same macOS checks (paths, sockets, shells) until the image retires in fall 2027.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Rust library tests
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          command -v setfacl >/dev/null || sudo apt-get install -y acl
          cargo test --locked --manifest-path core/Cargo.toml
      - name: Use Git Bash for shell examples on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          $bashDir = Join-Path $gitRoot bin
          if (!(Test-Path (Join-Path $bashDir bash.exe))) { throw "Git Bash is required" }
          $bashDir >> $env:GITHUB_PATH
      - name: Provide the remote Linux command fixture on macOS
        if: runner.os == 'macOS'
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Rust compatibility tests
        env:
          BENEDICT_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test --locked --no-fail-fast --manifest-path verification/compat/Cargo.toml
      - name: Verify bundled Rust components
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          for crate in courier native plaza; do cargo test --locked --manifest-path "$crate/Cargo.toml"; done
          cargo build --locked --manifest-path core/Cargo.toml
          cargo build --locked --manifest-path courier/Cargo.toml
          bash courier/tests/handoff.sh "$PWD/core/target/debug/benedict" "$PWD/courier/target/debug/courier"
      - name: Test Docker installation and handoff
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: bash tests/docker-handoff.sh
      - name: Test Plaza on a fresh Docker volume
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          docker build -t benedict-plaza-ci plaza
          sh plaza/tests/fresh-volume.sh benedict-plaza-ci
