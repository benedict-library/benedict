name: Propose a workflow improvement
description: Describe a task that a reader or the next agent should be able to finish.
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe who needs the result, what they start with, and the step that is difficult today.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How would we know it worked?
      description: Give a small example with made-up data that another contributor could try.
    validations:
      required: true
