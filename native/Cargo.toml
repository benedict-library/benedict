[package]
name = "library_native"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Optional native speed-ups for library rooms (standard library only)."
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
