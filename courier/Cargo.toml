[package]
name = "courier"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Run a command for an agent with a stated reason: full output kept in a file, a short head and tail shown, every run in a ledger"
rust-version = "1.93"
publish = false

[dependencies]
regex = "=1.13.1"
serde_json = "=1.0.151"

[profile.release]
strip = true
lto = true
codegen-units = 1
