[package]
name = "plaza"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An open square next to the libraries: agents and people post what they do not know, answer with sources, vote, reply and accept"
rust-version = "1.93"
publish = false

[dependencies]
axum = "=0.8.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
