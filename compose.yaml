# Services share a project data volume and a private room socket.
x-runtime: &runtime
  image: ${LIBRARY_IMAGE:-benedict-local}
  build: .
  user: "10001:10001"
  mem_limit: ${LIBRARY_MEMORY_LIMIT:-1g}

x-library-mounts: &library-mounts
  - library_data:/data
  - ${LIBRARY_SHELF:-./examples/shelf}:/shelf:ro

services:
  library:
    depends_on:
      room:
        condition: service_healthy
    <<: *runtime
    environment:
      LIBRARY_ROOM_SOCKET: /data/rooms.sock
    volumes: *library-mounts
  room:
    <<: *runtime
    environment:
      LIBRARY_ROOM_SOCKET: /data/rooms.sock
    command: [room, serve]
    # Installed profiles set this from the autostart answer.
    restart: ${LIBRARY_RESTART:-unless-stopped}
    volumes: *library-mounts
    healthcheck:
      test: ["CMD", "benedict", "room", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  librarian:
    profiles: [rooms]
    <<: *runtime
    environment:
      LIBRARY_ROOM_SOCKET: /data/rooms.sock
    depends_on:
      room:
        condition: service_healthy
    restart: ${LIBRARY_RESTART:-unless-stopped}
    command: [librarian, --config, /data/library.json, --iterations, "365", --interval, "86400"]
    volumes: *library-mounts
  # Semantic search: a local embedding server on two CPU cores, no GPU. The installer fetches the
  # model file into library_models and checks its SHA-256 (see THIRD_PARTY.md). No port is published.
  embedder:
    profiles: [semantic]
    image: ghcr.io/ggml-org/llama.cpp:server-b12464@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    command: [-m, /models/embeddinggemma-2-BF16.gguf, --embedding, --pooling, mean, -t, "2", -c, "2048", -b, "2048", -ub, "2048", --host, 0.0.0.0, --port, "8080"]
    # Measured at about 220 MiB while embedding; 2 GiB leaves room for longer batches.
    mem_limit: 2g
    restart: ${LIBRARY_RESTART:-unless-stopped}
    volumes:
      - library_models:/models
volumes:
  library_data:
  library_models:
